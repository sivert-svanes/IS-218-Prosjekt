<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShelterLog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='/style/style.css')}}" onerror="href='../static/style/style.css';">
    <script src="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.4.3/mapbox-gl-draw.js"></script>
    <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.4.3/mapbox-gl-draw.css" type="text/css" />
  </head>

  <body style="margin: 0;">
    <!-- Loading Screen -->
    <div id="loading-screen">
      <h1 style="color: #f2f3f0; margin-bottom: 20px; font-size: 36px;">ShelterLog</h1>
      <div class="loading-container">
        <div id="loading-bar-fill" class="loading-bar-fill"></div>
      </div>
      <p id="loading-status">Initialiserer kart...</p>
    </div>

    <!-- Main Menu -->
    <div id="main-menu" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: flex-start; z-index: 1000;">
      <div style="background: rgba(37,37,51,0.88); padding: 40px; width: 20%; height: 100%; display: flex; flex-direction: column; justify-content: center;">
        <h1 style="margin: 0 0 30px 0; font-size: 28px; color: #f2f3f0">ShelterLog</h1>
        <button onclick="selectMode('find-shelter')" class="menu-btn">Finn tilfluktsrom</button>
        <button onclick="selectMode('logistics')" class="menu-btn">Logistikk</button>
        <button onclick="selectMode('landsoversikt')" class="menu-btn">Landsoversikt</button>
      </div>
    </div>

    <div id="map" style="width: 100vw; height: 100vh;"></div>
    <div id="map-overlay" class="map-overlay container" style="visibility: hidden;">
      <div class="header box prevent-select" onclick="backToMenu()" style="cursor: pointer;">
        ShelterLog
      </div>

      <div class="dropdown">
        <div class="box text prevent-select button dropdown-toggle" id="layers-toggle">Lag ▾</div>
      </div>

      <div class="dropdown">
        <div class="box text prevent-select button dropdown-toggle" id="styles-toggle">Kart ▾</div>
      </div>

       <div class="box text prevent-select button" id="shortest-path-btn">
        <span style="position: relative; z-index: 2; display: flex; justify-content: center; align-items: center; width: 100%; height: 100%;">Finn tilfluktsrom</span>

        <div class="loading-bar"style="position: relative; top: 0; left: 0; right: 0; bottom: 0;"></div>
      </div>


      <div class="box text prevent-select button" id="clear-path-btn" style="display: none;">
        <span style="position: relative; z-index: 2;">✕</span>
      </div>

      <div id="exclusion-draw-controls" style="display: none;">
          <select id="exclusion-type-select" class="box text" style="background: rgba(15,25,30,0.5); color: #c2c8ca; border: none; border-radius: 0.25rem; margin: 0.25rem; padding: 0.25rem 0.5rem;"></select>
          <div class="box text prevent-select button" id="draw-start-btn">Tegn</div>
          <div class="box text prevent-select button" id="draw-save-btn" style="display: none;">Lagre</div>
          <div class="box text prevent-select button" id="draw-cancel-btn">Avbryt</div>
      </div>

    </div>

    <div class="dropdown-menu" id="layers-menu"></div>

    <div class="dropdown-menu" id="styles-menu">
      <div class="dropdown-empty">No map styles available</div>
    </div>

    <script type="module" src="{{ url_for('static', filename='js/main.js') }}?v={{ ts }}"
          onerror="let s=document.createElement('script');s.type='module';s.src='../static/js/main.js';document.body.prepend(s);">

    </script>

    <script>
    function selectMode(mode) {
    if (window.stopRotation) window.stopRotation();
    document.getElementById('main-menu').classList.add('active');
    document.getElementById('map-overlay').style.visibility = 'visible';

    document.querySelectorAll('.maplibregl-ctrl').forEach(el => el.style.display = '');

    // Hide all mode-specific buttons
    document.getElementById('shortest-path-btn').style.display = 'none';
    document.getElementById('clear-path-btn').style.display = 'none';
    const coverageBtn = document.getElementById('coverage-analysis-btn');
    if (coverageBtn) coverageBtn.style.display = 'none';
    document.getElementById('exclusion-draw-controls').style.display = 'none';

    // Show buttons based on mode
    if (mode === 'find-shelter') {
     window.triggerGeolocate();
      document.getElementById('shortest-path-btn').style.display = 'flex';
    } else if (mode === 'logistics') {
      window.triggerGeolocate();
      // No buttons for logistics
    } else if (mode === 'landsoversikt') {
      window.zoomToNorway();
      document.getElementById('coverage-analysis-btn').style.display = 'flex';
      document.getElementById('exclusion-draw-controls').style.display = 'contents';
    }
  }

  async function backToMenu() {
    if (window.zoomToGlobe) await window.zoomToGlobe();
    if (window.startRotation) window.startRotation();
    if (window.stopGeolocate) window.stopGeolocate();
    document.getElementById('main-menu').classList.remove('active');
    document.getElementById('map-overlay').style.visibility = 'hidden';

    document.querySelectorAll('.maplibregl-ctrl').forEach(el => el.style.display = 'none')

    document.getElementById('shortest-path-btn').style.display = 'none';
    document.getElementById('clear-path-btn').style.display = 'none';
    const coverageBtn = document.getElementById('coverage-analysis-btn');
    if (coverageBtn) coverageBtn.style.display = 'none';
    document.getElementById('exclusion-draw-controls').style.display = 'none';
    if (window.cancelDrawing) window.cancelDrawing();
  }


    </script>
  </body>
</html>
