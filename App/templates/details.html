<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tilfluktsrom Detaljer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        .error {
            background: #fee;
            border-left: 4px solid #c33;
            padding: 15px;
            border-radius: 4px;
            color: #c33;
            margin-bottom: 20px;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 30px;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: background 0.3s;
        }

        .back-button:hover {
            background: #764ba2;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .detail-item {
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
        }

        .detail-item:last-child {
            border-bottom: none;
        }

        .detail-label {
            font-weight: 600;
            color: #667eea;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .detail-value {
            color: #333;
            font-size: 16px;
            word-break: break-word;
        }

        .no-data {
            color: #999;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-button">← Tilbake til kart</a>

        {% if error %}
            <div class="error">
                <strong>Feil:</strong> {{ error }}
            </div>
        {% elif shelter %}
            <h1>Tilfluktsrom Detaljer</h1>
            <div class="details-grid">
                {% for key, value in shelter.items() %}
                    <div class="detail-item">
                        <div class="detail-label">{{ key }}</div>
                        <div class="detail-value">
                            {% if value is none or value == '' %}
                                <span class="no-data">Ikke oppgitt</span>
                            {% else %}
                                {{ value }}
                            {% endif %}
                        </div>
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <div class="error">
                <strong>Feil:</strong> Tilfluktsrom ikke funnet.
            </div>
        {% endif %}
    </div>
</body>
</html>
